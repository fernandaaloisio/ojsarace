<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 620" width="2400" height="620"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Banner institucional da revista ARACÊ">
  <title>ARACÊ</title>
  <!--
    Campo de cor, não fotografia. A marca aparece em grande no terço direito,
    e o canto inferior esquerdo fica limpo porque é lá que o site desenha o
    nome da revista, a linha de apresentação e o ISSN por cima.
  -->
  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#06211b"/>
      <stop offset="0.5" stop-color="#0c3a30"/>
      <stop offset="1" stop-color="#12513f"/>
    </linearGradient>

    <linearGradient id="sol" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8d3f16"/>
      <stop offset="0.45" stop-color="#b4531f"/>
      <stop offset="1" stop-color="#e09a35"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#e09a35" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#b4531f" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#b4531f" stop-opacity="0"/>
    </radialGradient>

    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <linearGradient id="veu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05120e" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#05120e" stop-opacity="0.4"/>
      <stop offset="0.72" stop-color="#05120e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#05120e" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="recorte"><rect width="2400" height="620"/></clipPath>
  </defs>

  <g clip-path="url(#recorte)">
    <rect width="2400" height="620" fill="url(#campo)"/>

    <!-- luz em volta do sol -->
    <ellipse cx="1760" cy="470" rx="760" ry="420" fill="url(#halo)"/>

    <!-- Camadas de ar: mais juntas perto da linha, como num amanhecer.
         Dão profundidade sem recorrer a imagem. -->
    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
      <path d="M0 110H2400M0 178H2400M0 240H2400M0 296H2400M0 344H2400M0 386H2400
               M0 420H2400M0 448H2400M0 468H2400"/>
    </g>

    <!-- A marca, em escala: semicírculo sobre a linha -->
    <g transform="translate(1760 470)">
      <path d="M-215 0 A215 215 0 0 1 215 0 Z" fill="url(#sol)"/>
    </g>

    <!-- linha do horizonte, atravessando o campo inteiro -->
    <rect x="0" y="482" width="2400" height="9" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="1545" y="482" width="430" height="9" fill="#e09a35"/>

    <!-- Véu só onde o site escreve por cima: forte na esquerda, quase nulo na
         direita, para o sol não ficar apagado. -->
    <rect x="0" y="0" width="2400" height="620" fill="url(#veu)"/>
    <rect width="2400" height="620" filter="url(#grao)" opacity="0.045"/>
  </g>
</svg>
