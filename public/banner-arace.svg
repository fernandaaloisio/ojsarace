<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 620" width="2400" height="620"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Amanhecer sobre a linha do horizonte">
  <!--
    Banner institucional da ARACÊ.
    "Aracê" é amanhecer em tupi. A imagem é a primeira luz: o campo de tinta da
    noite acima, a linha do horizonte com o sol nascendo, e as estrias finas de
    luz que a tipografia de periódico impresso usa como régua. Sem fotografia e
    sem degradê chapado: a transição é feita por bandas, como uma impressão.
  -->
  <defs>
    <linearGradient id="noite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1118"/>
      <stop offset="42%"  stop-color="#17202c"/>
      <stop offset="72%"  stop-color="#36302c"/>
      <stop offset="88%"  stop-color="#6d4a2c"/>
      <stop offset="100%" stop-color="#9c5c27"/>
    </linearGradient>

    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e9c477" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#e9c477" stop-opacity="0.85"/>
      <stop offset="34%"  stop-color="#e9c477" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e9c477" stop-opacity="0.12"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.18" cy="1" r="0.55">
      <stop offset="0%"   stop-color="#f0ad4b" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#c76a26" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c76a26" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b1510"/>
      <stop offset="100%" stop-color="#120e0a"/>
    </linearGradient>

    <!-- grão discreto, para o campo não ficar com aspecto de plástico -->
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- céu -->
  <rect width="2400" height="430" fill="url(#noite)"/>
  <rect width="2400" height="430" fill="url(#halo)"/>

  <!-- estrias de luz: réguas finas que clareiam na direção do sol -->
  <g>
    <rect x="0" y="118" width="2400" height="1.5" fill="url(#brilho)" opacity="0.30"/>
    <rect x="0" y="168" width="2400" height="1.5" fill="url(#brilho)" opacity="0.38"/>
    <rect x="0" y="214" width="2400" height="1.5" fill="url(#brilho)" opacity="0.46"/>
    <rect x="0" y="256" width="2400" height="1.5" fill="url(#brilho)" opacity="0.54"/>
    <rect x="0" y="294" width="2400" height="2"   fill="url(#brilho)" opacity="0.62"/>
    <rect x="0" y="328" width="2400" height="2"   fill="url(#brilho)" opacity="0.70"/>
    <rect x="0" y="358" width="2400" height="2.5" fill="url(#brilho)" opacity="0.78"/>
    <rect x="0" y="384" width="2400" height="3"   fill="url(#brilho)" opacity="0.86"/>
    <rect x="0" y="406" width="2400" height="3.5" fill="url(#brilho)" opacity="0.92"/>
  </g>

  <!-- o sol, nascendo sobre a linha -->
  <circle cx="432" cy="430" r="86" fill="#f0a93f" opacity="0.22"/>
  <circle cx="432" cy="430" r="52" fill="#e8933a" opacity="0.45"/>
  <circle cx="432" cy="430" r="27" fill="#f6c468"/>

  <!-- a linha do horizonte: a marca da casa -->
  <rect x="0" y="429" width="2400" height="2.5" fill="#f2c173" opacity="0.95"/>

  <!-- terra: campo escuro, com as mesmas réguas em negativo -->
  <rect y="431" width="2400" height="189" fill="url(#terra)"/>
  <g opacity="0.22">
    <rect x="0" y="452" width="2400" height="1" fill="#e9c477" opacity="0.5"/>
    <rect x="0" y="486" width="2400" height="1" fill="#e9c477" opacity="0.34"/>
    <rect x="0" y="528" width="2400" height="1" fill="#e9c477" opacity="0.2"/>
    <rect x="0" y="578" width="2400" height="1" fill="#e9c477" opacity="0.1"/>
  </g>
  <!-- reflexo do sol na terra -->
  <ellipse cx="432" cy="431" rx="150" ry="58" fill="#c87a2e" opacity="0.16"/>

  <rect width="2400" height="620" filter="url(#grao)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
