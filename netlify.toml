# Aurora — plataforma de periódicos da New Science Publishers

[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # o Prisma precisa baixar o motor do alvo serverless durante a instalação
  PRISMA_CLI_QUERY_ENGINE_TYPE = "binary"

[functions]
  # o runtime empacota as funções por análise estática e não enxerga os
  # binários do Prisma, que são carregados em tempo de execução
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-darwin*"
  ]

# cache na borda da Netlify para o que é público: a primeira visita paga a
# consulta ao banco, as seguintes são servidas pela CDN
[[headers]]
  for = "/artigo/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/edicao/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/explorar/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/autor/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/api/oai"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=1800, stale-while-revalidate=86400"

[[headers]]
  for = "/painel/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/arquivo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/painel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/parecer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
